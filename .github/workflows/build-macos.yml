name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-15
            arch: arm64
          - label: Intel
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r requirements-build.txt
      - name: Verify application
        run: |
          npm run typecheck
          npm run test:frontend
          python3 -m pytest backend/tests -q
      - name: Build frontend and native backend
        run: |
          npm run build
          npm run build:backend:mac
          chmod +x backend-dist/atelier-backend
      - name: Build DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-Docs-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Atelier-Docs-*
          path: release
          merge-multiple: true
      - name: Publish DMG files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          cd release
          shasum -a 256 *.dmg > SHA256SUMS.txt
          gh release create "v${version}" ./*.dmg SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Atelier Docs ${version}" \
            --notes "macOS için Apple Silicon ve Intel DMG paketleri. Paketler henüz Apple Developer kimliğiyle imzalanmamış ve noterlenmemiştir."
