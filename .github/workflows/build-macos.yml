name: Build Desktop Installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-15
            arch: arm64
          - label: Intel
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install -r requirements-build.txt
      - name: Verify application
        run: |
          npm run typecheck
          npm run test:frontend
          python3 -m pytest backend/tests -q
      - name: Build frontend and native backend
        run: |
          npm run build
          npm run build:backend:mac
          chmod +x backend-dist/atelier-backend
      - name: Build DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify packaged macOS application
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" -quiet || true
            rmdir "$mount_path" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -mountpoint "$mount_path" -nobrowse -readonly -quiet
          app_path="$mount_path/Atelier Docs.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          test -x "$app_path/Contents/Resources/backend/atelier-backend"
          file "$app_path/Contents/MacOS/Atelier Docs"
          file "$app_path/Contents/Resources/backend/atelier-backend"
          smoke_output="$RUNNER_TEMP/atelier-docs-smoke-${{ matrix.arch }}.json"
          ATELIER_SMOKE_OUTPUT="$smoke_output" \
            "$app_path/Contents/MacOS/Atelier Docs" --smoke-test
          python3 - "$smoke_output" <<'PY'
          import json
          import pathlib
          import sys

          result = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result.get("ok"):
              raise SystemExit("Paketlenmiş macOS uygulaması smoke testini geçemedi")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-Docs-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          choco install tesseract -y --no-progress
          npm ci
          python -m pip install -r requirements-build.txt
      - name: Verify application
        run: |
          npm run typecheck
          npm run test:frontend
          python -m pytest backend/tests -q
      - name: Build frontend and native backend
        run: |
          npm run build
          python -m PyInstaller --noconfirm --clean --onefile --name atelier-backend --distpath backend-dist --workpath build/pyinstaller --specpath build backend/run_server.py
          npm run prepare:ocr:win
      - name: Build EXE installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-Docs-windows
          path: release/*Setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Atelier-Docs-*
          path: release
          merge-multiple: true
      - name: Publish DMG files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          cd release
          shasum -a 256 *.dmg *.exe > SHA256SUMS.txt
          if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "v${version}" ./*.dmg ./*.exe SHA256SUMS.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "v${version}" ./*.dmg ./*.exe SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Atelier Docs ${version}" \
              --notes "Windows EXE ile macOS Apple Silicon ve Intel DMG paketleri. macOS paketleri DMG içinden gerçek uygulama ve yerel backend başlatılarak doğrulanmış ve ad-hoc imzalanmıştır. Apple Developer ID/noter kaydı bulunmadığından ilk açılışta Finder'da uygulamaya sağ tıklayıp Aç seçilmesi gerekebilir."
          fi
